<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linkly settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <main>
      <h1>Linkly settings</h1>
      <form id="form" autocomplete="off">
        <label for="instance">Instance URL</label>
        <input id="instance" type="text" inputmode="url" placeholder="http://localhost:3000" spellcheck="false" />

        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" placeholder="lk_..." spellcheck="false" />
        <p class="hint"><a id="createKey" href="http://localhost:3000/dashboard/settings" target="_blank" rel="noopener">Create an API key</a> in Settings, API keys tab.</p>

        <button id="save" class="btn primary" type="submit">Save</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
